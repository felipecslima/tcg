<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ds-bg);font-family:var(--ds-font-body);color:var(--ds-text-primary)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;height:56px;border-radius:10px;display:flex;align-items:flex-end;padding:7px;font:400 9px/1.2 var(--ds-font-mono)}</style></head><body><div class="w"><div class="row" style="padding:10px 0 16px"><div class="sw" style="background:var(--ds-surface);box-shadow:var(--ds-shadow-raised);color:var(--ds-text-secondary);align-items:center;justify-content:center;padding:0">raised</div><div class="sw" style="background:var(--ds-surface);box-shadow:var(--ds-shadow-card);color:var(--ds-text-secondary);align-items:center;justify-content:center;padding:0">card</div><div class="sw" style="background:var(--ds-surface);box-shadow:var(--ds-shadow-hero);color:var(--ds-text-secondary);align-items:center;justify-content:center;padding:0">hero</div><div class="sw" style="background:var(--ds-surface);box-shadow:var(--ds-shadow-action);color:var(--ds-text-secondary);align-items:center;justify-content:center;padding:0">action</div></div></div></body></html>
