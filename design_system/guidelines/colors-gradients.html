<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ds-bg);font-family:var(--ds-font-body);color:var(--ds-text-primary)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:72px;height:56px;border-radius:10px;display:flex;align-items:flex-end;padding:7px;font:400 9px/1.2 var(--ds-font-mono)}</style></head><body><div class="w"><div class="row"><div class="sw" style="background:var(--ds-grad-hero);color:#fff">grad-hero</div><div class="sw" style="background:var(--ds-grad-node);color:#fff">grad-node</div><div class="sw" style="background:var(--ds-placeholder);color:var(--ds-text-secondary);border:1px dashed var(--ds-border-strong)">placeholder</div></div><div style="height:8px;border-radius:99px;background:var(--ds-tint);overflow:hidden"><div style="height:100%;width:62%;border-radius:99px;background:var(--ds-grad-progress)"></div></div></div></body></html>
