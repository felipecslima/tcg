name: pokecardex_scanner_mvp
description: MVP do scanner de cartas Pokémon TCG — foco só em reconhecer cartas em lote.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Rede (TCGdex)
  http: ^1.2.1

  # Câmera + OCR on-device
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0

  # Salvar o resultado da sessão de scan localmente (sem backend ainda)
  path_provider: ^2.1.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
