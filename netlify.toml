# Config de deploy do Netlify.
[build]
  command = "npm run build"
  publish = "dist"

# Proxy pra pokemontcg.io. Em dev quem faz isso é o server.proxy do Vite; no
# site publicado esse proxy não existe, então recriamos aqui. status=200 faz
# rewrite (não redirect) → o browser vê same-origin e não bate no CORS.
# BASE do cliente no browser é /pokeapi/v2 (ver src/matching/pokemontcg.ts).
[[redirects]]
  from = "/pokeapi/*"
  to = "https://api.pokemontcg.io/:splat"
  status = 200
  force = true
